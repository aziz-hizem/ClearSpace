name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      recycle_spike:
        description: "Also run the Recycle Bin spike (sandbox files only, ~5 min)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  ui:
    name: UI — lint, types, tests, screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Product identity is in sync (product.json)
        run: npm run product:check
      - run: npx biome ci .
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build
      - name: Screenshots of the browser preview (sample data)
        run: |
          npx playwright install --with-deps chromium
          (npx vite preview --port 4173 --strictPort &)
          sleep 2
          mkdir -p screenshots
          node scripts/screenshots.mjs screenshots light
          node scripts/screenshots.mjs screenshots dark
      - uses: actions/upload-artifact@v7
        with:
          name: ui-screenshots
          path: screenshots/

  windows:
    name: Windows x64 — lint, test, app build
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - name: Build the UI (embedded by the app crate)
        run: npm run build

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (deletion guard is a hard error)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --workspace

      - name: Build cs-scan (release)
        run: cargo build --release -p clearspace-scan-cli
      - name: Smoke-scan C:\Windows (read-only)
        run: ./target/release/cs-scan.exe C:\Windows --top 10 --quiet

      - name: Build the desktop app and installer (unsigned)
        run: npm run tauri -- build --bundles nsis
      - uses: actions/upload-artifact@v7
        with:
          name: app-windows-x64
          path: |
            target/release/*.exe
            target/release/bundle/nsis/*.exe
      - uses: actions/upload-artifact@v7
        with:
          name: cs-scan-windows-x64
          path: target/release/cs-scan.exe

  recycle-spike:
    name: Recycle Bin spike (on request)
    if: github.event_name == 'workflow_dispatch' && inputs.recycle_spike
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run the spike (sandbox files only)
        env:
          CLEARSPACE_SPIKE_CI: "1"
        run: |
          cargo run --release -p clearspace-cleaner --example recycle_spike -- --report spike-report.md
          Get-Content spike-report.md | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v7
        with:
          name: recycle-spike-report
          path: spike-report.md

  windows-arm64:
    name: Windows ARM64 — compile only (experimental)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
      - run: npm ci && npm run build
      - name: Build for aarch64-pc-windows-msvc
        run: cargo build --workspace --all-targets --target aarch64-pc-windows-msvc

  linux:
    name: Linux — portable core (fast feedback)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # The Tauri app crate targets Windows (it needs WebView2), so it is checked in the Windows jobs.
      - run: cargo clippy --workspace --exclude clearspace-app --all-targets -- -D warnings
      - run: cargo test --workspace --exclude clearspace-app
